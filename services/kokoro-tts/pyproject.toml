[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "localassistant-kokoro-tts"
version = "0.1.0"
description = "Loopback-only local Kokoro TTS service for LocalAssistant"
requires-python = ">=3.11,<3.12"
dependencies = [
    "aiohttp==3.14.3",
    "kokoro==0.9.4",
    "torch==2.14.0",
    "numpy==2.4.6",
    "misaki==0.9.4",
    "espeakng-loader==0.2.4",
    "phonemizer-fork==3.3.2",
]

[project.optional-dependencies]
test = [
    "pytest==9.0.3",
    "pytest-asyncio==0.25.3",
]

[tool.pytest.ini_options]
addopts = "-q"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
pythonpath = ["src"]
