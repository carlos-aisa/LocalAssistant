[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "localassistant-kokoro-tts"
version = "0.1.0"
description = "Loopback-only local Kokoro TTS service for LocalAssistant"
requires-python = ">=3.11,<3.12"

[tool.pytest.ini_options]
addopts = "-q"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
pythonpath = ["src"]
