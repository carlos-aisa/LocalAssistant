# This file contains no secret. The service reads the fixed DPAPI secret path at runtime.
port = 57321
# Hugging Face cache root containing the prepared hexgrad/Kokoro-82M snapshot.
weights_directory = "C:/LocalAssistant/Kokoro/huggingface-cache"
cpu_threads = 8
model_load_timeout_seconds = 60
synthesis_timeout_seconds = 15

[profiles]
jarvis-es = { voice = "em_alex", language = "es" }
jarvis-es-alt = { voice = "em_santa", language = "es" }
jarvis-es-female = { voice = "ef_dora", language = "es" }
