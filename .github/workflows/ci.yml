name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore LocalAssistant.sln

      - name: Build
        run: dotnet build LocalAssistant.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test LocalAssistant.sln --configuration Release --no-build --logger "console;verbosity=normal"
