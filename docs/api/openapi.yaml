openapi: 3.0.3
info:
  title: LocalAssistant API
  version: 0.1.0
  description: >-
    Educational API demonstrating an explicit language-provider and tool-calling
    orchestration loop with deterministic fake scenarios and an optional Ollama
    adapter.
  license:
    name: MIT
    url: https://opensource.org/license/mit
servers:
  - url: http://localhost:5100
    description: Local development
paths:
  /health:
    get:
      operationId: getHealth
      summary: Check whether the API process is running.
      responses:
        "200":
          description: The API is running.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
  /api/documents:
    get:
      operationId: searchDocuments
      summary: Search the authorized local documents root by metadata only.
      security:
        - LocalApiKey: []
      parameters:
        - name: name
          in: query
          schema: { type: string }
        - name: extension
          in: query
          description: File extension including the leading period.
          schema: { type: string, example: .txt }
        - name: relativePath
          in: query
          description: Directory path relative to the configured documents root.
          schema: { type: string }
        - name: modifiedAfterUtc
          in: query
          schema: { type: string, format: date-time }
        - name: modifiedBeforeUtc
          in: query
          schema: { type: string, format: date-time }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
      responses:
        "200":
          description: Matching document metadata. File content and absolute paths are omitted.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DocumentSearchResponse"
        "400":
          description: One or more query parameters are invalid.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ValidationProblem"
        "401": { description: A local API key is required. }
        "403": { description: The authenticated principal lacks the documents.search scope. }
  /api/documents/{id}/content:
    get:
      operationId: readDocumentContent
      summary: Read bounded text content from an authorized local document.
      security:
        - LocalApiKey: []
      parameters:
        - name: id
          in: path
          required: true
          description: Protected document reference returned by the metadata search.
          schema: { type: string }
      responses:
        "200":
          description: Text content and safe document metadata.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DocumentContentResponse"
        "401": { description: A local API key is required. }
        "403": { description: The authenticated principal lacks the documents.read scope. }
        "404": { description: "The reference is invalid, expired, or no longer identifies an authorized file." }
        "422":
          description: The document format is unsupported or the file exceeds 1 MiB.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
  /api/conversations/messages:
    post:
      operationId: sendConversationMessage
      summary: Process one conversation message through the explicit orchestration loop.
      security:
        - {}
        - LocalApiKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SendMessageRequest"
      responses:
        "200":
          description: A final response was generated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConversationResponse"
        "202":
          description: A server-held tool call requires a decision.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConversationResponse"
        "400":
          description: The request, provider, provider configuration, or fake scenario is invalid.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ValidationProblem"
        "401":
          description: A supplied local API key was invalid, or a tool required authentication.
        "403":
          description: The authenticated principal was not authorized for a requested tool.
        "404":
          description: The requested conversation was not found or is not accessible to the caller.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConversationResponse"
        "409":
          description: The provider response was invalid or the iteration limit was reached.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConversationResponse"
        "422":
          description: A requested tool was missing or invalid.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConversationResponse"
        "502":
          description: The provider or a tool failed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConversationResponse"
        "504":
          description: The provider or a tool timed out.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConversationResponse"
  /api/conversations/{conversationId}/tool-confirmations/{confirmationId}/decisions:
    post:
      operationId: resolveToolConfirmation
      summary: Approve or reject one server-held tool call.
      security:
        - {}
        - LocalApiKey: []
      parameters:
        - name: conversationId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: confirmationId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResolveToolConfirmationRequest"
      responses:
        "200": { description: The decision was processed. }
        "401": { description: A supplied local API key was invalid. }
        "404": { description: The confirmation or its conversation was not found or is not accessible to the caller. }
        "409": { description: The provider does not match the pending confirmation. }
        "410": { description: The confirmation expired. }
        "502":
          description: The provider or a tool failed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConversationResponse"
        "504":
          description: The provider or a tool timed out.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConversationResponse"
components:
  securitySchemes:
    LocalApiKey:
      type: apiKey
      in: header
      name: X-LocalAssistant-Api-Key
      description: >-
        Optional local API key. When configured, it creates the server-defined
        principal and scopes used by the tool risk policy.
  schemas:
    HealthResponse:
      type: object
      required: [status]
      properties:
        status:
          type: string
          example: ok
    DocumentSearchResponse:
      type: object
      required: [documents]
      properties:
        documents:
          type: array
          items:
            $ref: "#/components/schemas/DocumentSearchResult"
    DocumentSearchResult:
      type: object
      required: [id, name, extension, relativePath, sizeBytes, lastModifiedUtc]
      properties:
        id: { type: string }
        name: { type: string }
        extension: { type: string }
        relativePath: { type: string }
        sizeBytes: { type: integer, format: int64, minimum: 0 }
        lastModifiedUtc: { type: string, format: date-time }
    DocumentContentResponse:
      type: object
      required: [name, extension, relativePath, sizeBytes, lastModifiedUtc, text]
      properties:
        name: { type: string }
        extension: { type: string }
        relativePath: { type: string }
        sizeBytes: { type: integer, format: int64, minimum: 0, maximum: 1048576 }
        lastModifiedUtc: { type: string, format: date-time }
        text: { type: string }
    ProblemDetails:
      type: object
      required: [title, status]
      properties:
        type: { type: string, format: uri, nullable: true }
        title: { type: string }
        status: { type: integer, format: int32 }
        detail: { type: string, nullable: true }
    SendMessageRequest:
      type: object
      required: [message]
      properties:
        message:
          type: string
          minLength: 1
        conversationId:
          type: string
          format: uuid
          nullable: true
        provider:
          type: string
          enum: [fake, ollama]
          default: fake
          description: Language provider used for this turn.
        scenario:
          type: string
          enum: [direct, time, temperature, reminder]
          default: direct
          description: Development-only scenario, used only when provider is fake. The reminder scenario requires the reminders.write scope and confirmation.
    ResolveToolConfirmationRequest:
      type: object
      required: [approved]
      properties:
        approved:
          type: boolean
        provider:
          type: string
          default: fake
        scenario:
          type: string
          default: direct
    ConversationResponse:
      type: object
      required: [conversationId, tools, iterations, timings]
      properties:
        conversationId:
          type: string
          format: uuid
        content:
          type: string
          nullable: true
        tools:
          type: array
          items:
            $ref: "#/components/schemas/ToolExecutionTrace"
        iterations:
          type: integer
          format: int32
          minimum: 0
        timings:
          $ref: "#/components/schemas/ExecutionTimings"
        error:
          allOf:
            - $ref: "#/components/schemas/OrchestrationError"
          nullable: true
        confirmation:
          allOf:
            - $ref: "#/components/schemas/ToolConfirmationRequest"
          nullable: true
    ToolConfirmationRequest:
      type: object
      required: [confirmationId, toolCallId, toolName, arguments, expiresAtUtc]
      properties:
        confirmationId: { type: string, format: uuid }
        toolCallId: { type: string }
        toolName: { type: string }
        arguments: { type: object, additionalProperties: true }
        expiresAtUtc: { type: string, format: date-time }
    ToolExecutionTrace:
      type: object
      required: [toolCallId, toolName, succeeded, durationMilliseconds]
      properties:
        toolCallId:
          type: string
        toolName:
          type: string
        succeeded:
          type: boolean
        durationMilliseconds:
          type: number
          format: double
          minimum: 0
        errorCode:
          type: string
          nullable: true
    ExecutionTimings:
      type: object
      required:
        - startedAtUtc
        - completedAtUtc
        - totalMilliseconds
        - providerMilliseconds
        - toolsMilliseconds
      properties:
        startedAtUtc:
          type: string
          format: date-time
        completedAtUtc:
          type: string
          format: date-time
        totalMilliseconds:
          type: number
          format: double
          minimum: 0
        providerMilliseconds:
          type: number
          format: double
          minimum: 0
        toolsMilliseconds:
          type: number
          format: double
          minimum: 0
    OrchestrationError:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
        message:
          type: string
        toolName:
          type: string
          nullable: true
    ValidationProblem:
      type: object
      required: [title, status, errors]
      properties:
        type:
          type: string
          format: uri
        title:
          type: string
        status:
          type: integer
          format: int32
          example: 400
        errors:
          type: object
          additionalProperties:
            type: array
            items:
              type: string
