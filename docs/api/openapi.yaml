openapi: 3.0.3
info:
  title: LocalAssistant API
  version: 0.1.0
  description: >-
    Educational API demonstrating an explicit language-provider and tool-calling
    orchestration loop with deterministic fake scenarios and an optional Ollama
    adapter.
  license:
    name: MIT
    url: https://opensource.org/license/mit
servers:
  - url: http://localhost:5100
    description: Local development
paths:
  /api/private/sessions:
    post:
      operationId: createPrivateSession
      summary: Exchange a registered private-client credential for a temporary loopback bearer token.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreatePrivateSessionRequest" }
      responses:
        "200":
          description: A temporary bearer token. The client must keep it in memory only.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PrivateSessionResponse" }
        "400": { description: The client ID or credential is missing. }
        "401": { description: The private-client credential is invalid or revoked. }
        "404": { description: The request was not received through loopback. }
  /api/private/admin/pairings:
    post:
      operationId: completePrivateClientPairing
      summary: Consume a local administrative pairing challenge and return a new client credential once.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CompletePrivateClientPairingRequest" }
      responses:
        "200":
          description: The registered client and its one-time credential.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PrivateClientCredentialResponse" }
        "400": { description: The request is malformed or no installation owner exists. }
        "404": { description: "The challenge is invalid, expired, consumed, or the request is not loopback." }
  /api/private/admin/credential-rotations:
    post:
      operationId: rotatePrivateClientCredential
      summary: Consume an administrative challenge to rotate one private-client credential.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ConsumeAdministrativeChallengeRequest" }
      responses:
        "200":
          description: The replacement credential for the requested client; existing sessions are invalidated.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PrivateClientCredentialResponse" }
        "400": { description: The challenge or client ID is missing. }
        "404": { description: "The challenge is invalid, expired, consumed, targets another client, or the request is not loopback." }
  /api/private/admin/client-revocations:
    post:
      operationId: revokePrivateClient
      summary: Consume an administrative challenge to revoke one private client and its sessions.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ConsumeAdministrativeChallengeRequest" }
      responses:
        "200":
          description: The requested client and all of its sessions were revoked.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PrivateClientRevocationResponse" }
        "400": { description: The challenge or client ID is missing. }
        "404": { description: "The challenge is invalid, expired, consumed, targets another client, or the request is not loopback." }
  /health:
    get:
      operationId: getHealth
      summary: Check whether the API process is running.
      responses:
        "200":
          description: The API is running.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
  /api/documents:
    get:
      operationId: searchDocuments
      summary: Search the authorized local documents root by metadata only.
      security:
        - PrivateBearer: []
      parameters:
        - name: name
          in: query
          schema: { type: string }
        - name: extension
          in: query
          description: File extension including the leading period.
          schema: { type: string, example: .txt }
        - name: relativePath
          in: query
          description: Directory path relative to the configured documents root.
          schema: { type: string }
        - name: modifiedAfterUtc
          in: query
          schema: { type: string, format: date-time }
        - name: modifiedBeforeUtc
          in: query
          schema: { type: string, format: date-time }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
      responses:
        "200":
          description: Matching document metadata. File content and absolute paths are omitted.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DocumentSearchResponse"
        "400":
          description: One or more query parameters are invalid.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ValidationProblem"
        "401": { description: A valid private bearer token is required. }
        "403": { description: The authenticated principal lacks the documents.search scope. }
  /api/documents/{id}/content:
    get:
      operationId: readDocumentContent
      summary: Read bounded text content from an authorized local document.
      security:
        - PrivateBearer: []
      parameters:
        - name: id
          in: path
          required: true
          description: Protected document reference returned by the metadata search.
          schema: { type: string }
      responses:
        "200":
          description: Text content and safe document metadata.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DocumentContentResponse"
        "401": { description: A valid private bearer token is required. }
        "403": { description: The authenticated principal lacks the documents.read scope. }
        "404": { description: "The reference is invalid, expired, or no longer identifies an authorized file." }
        "422":
          description: The document format is unsupported or the file exceeds 1 MiB.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
  /api/documents/content-search:
    get:
      operationId: searchDocumentContent
      summary: Search authorized local text documents and return an excerpt only with documents.read.
      security:
        - PrivateBearer: []
      parameters:
        - name: text
          in: query
          required: true
          schema: { type: string, minLength: 1, maxLength: 200 }
        - name: extension
          in: query
          schema: { type: string, example: .txt }
        - name: relativePath
          in: query
          schema: { type: string }
        - name: modifiedAfterUtc
          in: query
          schema: { type: string, format: date-time }
        - name: modifiedBeforeUtc
          in: query
          schema: { type: string, format: date-time }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
      responses:
        "200":
          description: Matching document metadata without text fragments.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DocumentSearchResponse"
        "400": { description: The content search query is invalid. }
        "401": { description: A valid private bearer token is required. }
        "403": { description: The authenticated principal lacks the documents.content.search scope. }
  /api/memories/personal:
    post:
      operationId: createPersonalMemory
      summary: Create an explicit personal memory note.
      security:
        - PrivateBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreatePersonalMemoryRequest"
      responses:
        "201":
          description: The personal memory note was created.
          headers:
            Location:
              description: URI assigned to the created personal memory note.
              schema: { type: string, format: uri-reference }
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PersonalMemoryResponse"
        "400": { description: The personal memory text is invalid. }
        "401": { description: A valid private bearer token is required. }
        "403": { description: The authenticated principal lacks the memory.personal.write scope. }
        "503": { description: Personal memory persistence is disabled. }
    get:
      operationId: listPersonalMemories
      summary: List the authenticated principal's active personal memory notes.
      security:
        - PrivateBearer: []
      parameters:
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
      responses:
        "200":
          description: Active personal memory notes owned by the authenticated principal.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PersonalMemoryListResponse"
        "400": { description: The list query is invalid. }
        "401": { description: A valid private bearer token is required. }
        "403": { description: The authenticated principal lacks the memory.personal.read scope. }
        "503": { description: Personal memory persistence is disabled. }
  /api/memories/personal/{memoryId}:
    delete:
      operationId: deletePersonalMemory
      summary: Delete an explicit personal memory note owned by the authenticated principal.
      security:
        - PrivateBearer: []
      parameters:
        - name: memoryId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "204": { description: The personal memory note was deleted. }
        "400": { description: The personal memory identifier is invalid. }
        "401": { description: A valid private bearer token is required. }
        "403": { description: The authenticated principal lacks the memory.personal.write scope. }
        "404": { description: The personal memory note was not found or is not owned by the caller. }
        "503": { description: Personal memory persistence is disabled. }
  /api/conversations:
    get:
      operationId: listConversations
      summary: List persisted conversations owned by the authenticated principal.
      security:
        - PrivateBearer: []
      parameters:
        - $ref: "#/components/parameters/ConversationCursor"
        - $ref: "#/components/parameters/ConversationListLimit"
      responses:
        "200":
          description: A page of public conversation metadata.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConversationSummaryPage"
        "400": { description: The cursor or limit is invalid. }
        "401": { description: A valid private bearer token is required. }
        "403": { description: The authenticated principal lacks the conversations.read scope. }
        "503": { description: Conversation persistence is disabled. }
  /api/conversations/{conversationId}:
    get:
      operationId: getConversationDetails
      summary: Get public metadata for one persisted conversation owned by the authenticated principal.
      security:
        - PrivateBearer: []
      parameters:
        - name: conversationId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Public conversation metadata.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConversationDetails"
        "401": { description: A valid private bearer token is required. }
        "403": { description: The authenticated principal lacks the conversations.read scope. }
        "404": { description: The conversation was not found or is not owned by the caller. }
        "503": { description: Conversation persistence is disabled. }
    delete:
      operationId: deleteConversation
      summary: Delete one persisted conversation owned by the authenticated principal.
      security:
        - PrivateBearer: []
      parameters:
        - name: conversationId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: X-LocalAssistant-Confirm-Delete
          in: header
          required: true
          description: Must be supplied exactly once with the value true.
          schema: { type: string, enum: ["true"] }
      responses:
        "204": { description: The conversation and its persisted messages were deleted. }
        "400":
          description: The delete confirmation header is missing, repeated, or invalid.
        "401": { description: A valid private bearer token is required. }
        "404": { description: The conversation was not found or is not owned by the caller. }
        "503": { description: Conversation persistence is disabled. }
  /api/conversations/{conversationId}/history:
    get:
      operationId: getConversationHistory
      summary: Get sanitized public history for one persisted conversation owned by the authenticated principal.
      security:
        - PrivateBearer: []
      parameters:
        - name: conversationId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - $ref: "#/components/parameters/ConversationCursor"
        - $ref: "#/components/parameters/ConversationHistoryLimit"
      responses:
        "200":
          description: A page of public user and assistant messages only.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicConversationMessagePage"
        "400": { description: The cursor or limit is invalid. }
        "401": { description: A valid private bearer token is required. }
        "403": { description: The authenticated principal lacks the conversations.read scope. }
        "404": { description: The conversation was not found or is not owned by the caller. }
        "503": { description: Conversation persistence is disabled. }
  /api/conversations/{conversationId}/completion:
    post:
      operationId: completeConversation
      summary: Mark an owned conversation eligible for immediate background indexing.
      security:
        - PrivateBearer: []
      parameters:
        - name: conversationId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "204": { description: The conversation was marked. Repeating the operation is safe. }
        "401": { description: A valid private bearer token is required. }
        "404": { description: The conversation was not found or is not owned by the caller. }
        "503": { description: Conversation persistence is disabled. }
  /api/conversations/messages:
    post:
      operationId: sendConversationMessage
      summary: Process one conversation message through the explicit orchestration loop.
      security:
        - {}
        - PrivateBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SendMessageRequest"
      responses:
        "200":
          description: A final response was generated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConversationResponse"
        "202":
          description: A server-held tool call requires a decision.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConversationResponse"
        "400":
          description: The request, provider, provider configuration, or fake scenario is invalid.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ValidationProblem"
        "401":
          description: A supplied private bearer token was invalid, or a tool required authentication.
        "403":
          description: The authenticated principal was not authorized for a requested tool.
        "404":
          description: The requested conversation was not found or is not accessible to the caller.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConversationResponse"
        "409":
          description: The provider response was invalid or the iteration limit was reached.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConversationResponse"
        "422":
          description: A requested tool was missing or invalid.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConversationResponse"
        "502":
          description: The provider or a tool failed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConversationResponse"
        "504":
          description: The provider or a tool timed out.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConversationResponse"
  /api/conversations/{conversationId}/tool-confirmations/{confirmationId}/decisions:
    post:
      operationId: resolveToolConfirmation
      summary: Approve or reject one server-held tool call.
      security:
        - {}
        - PrivateBearer: []
      parameters:
        - name: conversationId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: confirmationId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResolveToolConfirmationRequest"
      responses:
        "200": { description: The decision was processed. }
        "401": { description: A supplied private bearer token was invalid. }
        "404": { description: The confirmation or its conversation was not found or is not accessible to the caller. }
        "409": { description: The provider does not match the pending confirmation. }
        "410": { description: The confirmation expired. }
        "502":
          description: The provider or a tool failed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConversationResponse"
        "504":
          description: The provider or a tool timed out.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConversationResponse"
components:
  securitySchemes:
    PrivateBearer:
      type: http
      scheme: bearer
      bearerFormat: opaque
      description: >-
        Temporary opaque token issued after a registered private client exchanges
        its durable credential through loopback.
  parameters:
    ConversationCursor:
      name: cursor
      in: query
      required: false
      description: Opaque cursor returned by the preceding page.
      schema: { type: string }
    ConversationListLimit:
      name: limit
      in: query
      required: false
      description: Requested page size; the server caps it at 50.
      schema: { type: integer, minimum: 1, maximum: 50, default: 50 }
    ConversationHistoryLimit:
      name: limit
      in: query
      required: false
      description: Requested page size; the server caps it at 100.
      schema: { type: integer, minimum: 1, maximum: 100, default: 100 }
  schemas:
    CreatePrivateSessionRequest:
      type: object
      required: [clientId, credential]
      properties:
        clientId: { type: string }
        credential: { type: string, writeOnly: true }
    PrivateSessionResponse:
      type: object
      required: [accessToken, expiresAtUtc]
      properties:
        accessToken: { type: string }
        expiresAtUtc: { type: string, format: date-time }
    CompletePrivateClientPairingRequest:
      type: object
      required: [challenge, displayName]
      properties:
        challenge: { type: string, writeOnly: true }
        displayName: { type: string, maxLength: 128 }
    ConsumeAdministrativeChallengeRequest:
      type: object
      required: [challenge, clientId]
      properties:
        challenge: { type: string, writeOnly: true }
        clientId:
          type: string
          description: The local client ID expected to match the administrative challenge target. It is not authorization.
    PrivateClientRevocationResponse:
      type: object
      required: [clientId]
      properties:
        clientId: { type: string }
    PrivateClientCredentialResponse:
      type: object
      required: [clientId, displayName, credential]
      properties:
        clientId: { type: string }
        displayName: { type: string }
        credential: { type: string }
    HealthResponse:
      type: object
      required: [status]
      properties:
        status:
          type: string
          example: ok
    CreatePersonalMemoryRequest:
      type: object
      required: [text]
      properties:
        text:
          type: string
          minLength: 1
          maxLength: 2000
    PersonalMemoryResponse:
      type: object
      required: [id, text, createdAtUtc, modifiedAtUtc, expiresAtUtc]
      properties:
        id: { type: string, format: uuid }
        text: { type: string }
        createdAtUtc: { type: string, format: date-time }
        modifiedAtUtc: { type: string, format: date-time }
        expiresAtUtc: { type: string, format: date-time }
    PersonalMemoryListResponse:
      type: object
      required: [memories]
      properties:
        memories:
          type: array
          items:
            $ref: "#/components/schemas/PersonalMemoryResponse"
    DocumentSearchResponse:
      type: object
      required: [documents]
      properties:
        documents:
          type: array
          items:
            $ref: "#/components/schemas/DocumentSearchResult"
    DocumentSearchResult:
      type: object
      required: [id, name, extension, relativePath, sizeBytes, lastModifiedUtc]
      properties:
        id: { type: string }
        name: { type: string }
        extension: { type: string }
        relativePath: { type: string }
        sizeBytes: { type: integer, format: int64, minimum: 0 }
        lastModifiedUtc: { type: string, format: date-time }
        excerpt:
          type: string
          nullable: true
          maxLength: 280
          description: Bounded excerpt from the best matching fragment. It is null unless the principal also has documents.read.
    DocumentContentResponse:
      type: object
      required: [name, extension, relativePath, sizeBytes, lastModifiedUtc, text]
      properties:
        name: { type: string }
        extension: { type: string }
        relativePath: { type: string }
        sizeBytes: { type: integer, format: int64, minimum: 0, maximum: 1048576 }
        lastModifiedUtc: { type: string, format: date-time }
        text: { type: string }
    ProblemDetails:
      type: object
      required: [title, status]
      properties:
        type: { type: string, format: uri, nullable: true }
        title: { type: string }
        status: { type: integer, format: int32 }
        detail: { type: string, nullable: true }
    SendMessageRequest:
      type: object
      required: [message]
      properties:
        message:
          type: string
          minLength: 1
        conversationId:
          type: string
          format: uuid
          nullable: true
        provider:
          type: string
          enum: [fake, ollama]
          default: fake
          description: Language provider used for this turn.
        scenario:
          type: string
          enum: [direct, time, temperature, reminder]
          default: direct
          description: Development-only scenario, used only when provider is fake. The reminder scenario requires the reminders.write scope and confirmation; it creates only a temporary in-memory experimental record and schedules no notification.
    ResolveToolConfirmationRequest:
      type: object
      required: [approved]
      properties:
        approved:
          type: boolean
        provider:
          type: string
          default: fake
        scenario:
          type: string
          default: direct
    ConversationResponse:
      type: object
      required: [conversationId, tools, iterations, timings]
      properties:
        conversationId:
          type: string
          format: uuid
        content:
          type: string
          nullable: true
        tools:
          type: array
          items:
            $ref: "#/components/schemas/ToolExecutionTrace"
        iterations:
          type: integer
          format: int32
          minimum: 0
        timings:
          $ref: "#/components/schemas/ExecutionTimings"
        error:
          allOf:
            - $ref: "#/components/schemas/OrchestrationError"
          nullable: true
        confirmation:
          allOf:
            - $ref: "#/components/schemas/ToolConfirmationRequest"
          nullable: true
    ConversationSummary:
      type: object
      required: [conversationId, title, lastActivityAtUtc]
      properties:
        conversationId: { type: string, format: uuid }
        title: { type: string }
        lastActivityAtUtc: { type: string, format: date-time }
        indexingRequestedAtUtc: { type: string, format: date-time, nullable: true }
    ConversationDetails:
      allOf:
        - $ref: "#/components/schemas/ConversationSummary"
    ConversationSummaryPage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/ConversationSummary"
        nextCursor: { type: string, nullable: true }
    PublicConversationMessage:
      type: object
      required: [role, content]
      properties:
        role: { type: string, enum: [user, assistant] }
        content: { type: string }
    PublicConversationMessagePage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/PublicConversationMessage"
        nextCursor: { type: string, nullable: true }
    ToolConfirmationRequest:
      type: object
      required: [confirmationId, toolCallId, toolName, arguments, expiresAtUtc]
      properties:
        confirmationId: { type: string, format: uuid }
        toolCallId: { type: string }
        toolName: { type: string }
        arguments: { type: object, additionalProperties: true }
        expiresAtUtc: { type: string, format: date-time }
    ToolExecutionTrace:
      type: object
      required: [toolCallId, toolName, succeeded, durationMilliseconds]
      properties:
        toolCallId:
          type: string
        toolName:
          type: string
        succeeded:
          type: boolean
        durationMilliseconds:
          type: number
          format: double
          minimum: 0
        errorCode:
          type: string
          nullable: true
    ExecutionTimings:
      type: object
      required:
        - startedAtUtc
        - completedAtUtc
        - totalMilliseconds
        - providerMilliseconds
        - toolsMilliseconds
      properties:
        startedAtUtc:
          type: string
          format: date-time
        completedAtUtc:
          type: string
          format: date-time
        totalMilliseconds:
          type: number
          format: double
          minimum: 0
        providerMilliseconds:
          type: number
          format: double
          minimum: 0
        toolsMilliseconds:
          type: number
          format: double
          minimum: 0
    OrchestrationError:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
        message:
          type: string
        toolName:
          type: string
          nullable: true
    ValidationProblem:
      type: object
      required: [title, status, errors]
      properties:
        type:
          type: string
          format: uri
        title:
          type: string
        status:
          type: integer
          format: int32
          example: 400
        errors:
          type: object
          additionalProperties:
            type: array
            items:
              type: string
