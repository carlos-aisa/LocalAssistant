openapi: 3.0.3
info:
  title: LocalAssistant API
  version: 0.1.0
  description: >-
    Educational API demonstrating an explicit language-provider and tool-calling
    orchestration loop with deterministic fake scenarios and an optional Ollama
    adapter.
  license:
    name: MIT
    url: https://opensource.org/license/mit
servers:
  - url: http://localhost:5100
    description: Local development
paths:
  /health:
    get:
      operationId: getHealth
      summary: Check whether the API process is running.
      responses:
        "200":
          description: The API is running.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
  /api/conversations/messages:
    post:
      operationId: sendConversationMessage
      summary: Process one conversation message through the explicit orchestration loop.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SendMessageRequest"
      responses:
        "200":
          description: A final response was generated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConversationResponse"
        "202":
          description: A server-held tool call requires a decision.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConversationResponse"
        "400":
          description: The request, provider, provider configuration, or fake scenario is invalid.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ValidationProblem"
        "409":
          description: The provider response was invalid or the iteration limit was reached.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConversationResponse"
        "422":
          description: A requested tool was missing or invalid.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConversationResponse"
        "502":
          description: The provider or a tool failed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConversationResponse"
        "504":
          description: The provider or a tool timed out.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConversationResponse"
  /api/conversations/{conversationId}/tool-confirmations/{confirmationId}/decisions:
    post:
      operationId: resolveToolConfirmation
      summary: Approve or reject one server-held tool call.
      parameters:
        - name: conversationId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: confirmationId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResolveToolConfirmationRequest"
      responses:
        "200": { description: The decision was processed. }
        "404": { description: The confirmation was not found. }
        "409": { description: The provider does not match the pending confirmation. }
        "410": { description: The confirmation expired. }
        "502":
          description: The provider or a tool failed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConversationResponse"
        "504":
          description: The provider or a tool timed out.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConversationResponse"
components:
  schemas:
    HealthResponse:
      type: object
      required: [status]
      properties:
        status:
          type: string
          example: ok
    SendMessageRequest:
      type: object
      required: [message]
      properties:
        message:
          type: string
          minLength: 1
        conversationId:
          type: string
          format: uuid
          nullable: true
        provider:
          type: string
          enum: [fake, ollama]
          default: fake
          description: Language provider used for this turn.
        scenario:
          type: string
          enum: [direct, time, temperature]
          default: direct
          description: Development-only scenario, used only when provider is fake.
    ResolveToolConfirmationRequest:
      type: object
      required: [approved]
      properties:
        approved:
          type: boolean
        provider:
          type: string
          default: fake
        scenario:
          type: string
          default: direct
    ConversationResponse:
      type: object
      required: [conversationId, tools, iterations, timings]
      properties:
        conversationId:
          type: string
          format: uuid
        content:
          type: string
          nullable: true
        tools:
          type: array
          items:
            $ref: "#/components/schemas/ToolExecutionTrace"
        iterations:
          type: integer
          format: int32
          minimum: 0
        timings:
          $ref: "#/components/schemas/ExecutionTimings"
        error:
          allOf:
            - $ref: "#/components/schemas/OrchestrationError"
          nullable: true
        confirmation:
          allOf:
            - $ref: "#/components/schemas/ToolConfirmationRequest"
          nullable: true
    ToolConfirmationRequest:
      type: object
      required: [confirmationId, toolCallId, toolName, arguments, expiresAtUtc]
      properties:
        confirmationId: { type: string, format: uuid }
        toolCallId: { type: string }
        toolName: { type: string }
        arguments: { type: object, additionalProperties: true }
        expiresAtUtc: { type: string, format: date-time }
    ToolExecutionTrace:
      type: object
      required: [toolCallId, toolName, succeeded, durationMilliseconds]
      properties:
        toolCallId:
          type: string
        toolName:
          type: string
        succeeded:
          type: boolean
        durationMilliseconds:
          type: number
          format: double
          minimum: 0
        errorCode:
          type: string
          nullable: true
    ExecutionTimings:
      type: object
      required:
        - startedAtUtc
        - completedAtUtc
        - totalMilliseconds
        - providerMilliseconds
        - toolsMilliseconds
      properties:
        startedAtUtc:
          type: string
          format: date-time
        completedAtUtc:
          type: string
          format: date-time
        totalMilliseconds:
          type: number
          format: double
          minimum: 0
        providerMilliseconds:
          type: number
          format: double
          minimum: 0
        toolsMilliseconds:
          type: number
          format: double
          minimum: 0
    OrchestrationError:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
        message:
          type: string
        toolName:
          type: string
          nullable: true
    ValidationProblem:
      type: object
      required: [title, status, errors]
      properties:
        type:
          type: string
          format: uri
        title:
          type: string
        status:
          type: integer
          format: int32
          example: 400
        errors:
          type: object
          additionalProperties:
            type: array
            items:
              type: string
